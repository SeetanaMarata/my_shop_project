<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы - Магазин товаров</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar { background-color: #343a40; min-height: 100vh; color: white; }
        .sidebar .nav-link { color: rgba(255,255,255,.75); padding: 0.75rem 1rem; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: white; background-color: #007bff; }
        .logo-section { padding: 1.5rem 1rem; border-bottom: 1px solid #4b545c; }
        .user-section { position: absolute; bottom: 0; width: 100%; border-top: 1px solid #4b545c; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Боковое меню (такое же как на главной) -->
            <div class="col-md-3 col-lg-2 sidebar p-0">
                <div class="logo-section">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 30px; height: 30px;">
                            <span class="text-white fw-bold">B</span>
                        </div>
                        <span class="fw-bold">Меню</span>
                    </div>
                </div>
                <nav class="nav flex-column">
                    <a class="nav-link" href="/"><i class="fas fa-home me-2"></i>Главная</a>
                    <a class="nav-link" href="/catalog"><i class="fas fa-th-large me-2"></i>Категории</a>
                    <a class="nav-link active" href="/orders"><i class="fas fa-shopping-cart me-2"></i>Заказы</a>
                    <a class="nav-link" href="/contacts"><i class="fas fa-address-book me-2"></i>Контакты</a>
                </nav>
                <div class="user-section p-3">
                    <!-- Тот же код пользовательской секции -->
                </div>
            </div>

            <!-- Основной контент -->
            <div class="col-md-9 col-lg-10 ms-sm-auto px-4 py-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Заказы</h1>
                </div>
                <div class="alert alert-info">
                    <p class="mb-0">Здесь будут отображаться ваши заказы</p>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
