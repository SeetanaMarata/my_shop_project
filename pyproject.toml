[tool.poetry]
name = "shop-app"
version = "0.1.0"
description = "Web application for online shop"
authors = ["Swetlana Mirzoeva <levka008@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.8.1"  # ✅ Обновили для совместимости

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
flake8 = "^5.0.0"    # ✅ Совместимая версия
isort = "^5.12.0"    # ✅ Совместимая версия

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose --color=yes"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  | \.git
  | \.venv
  | build
  | dist
  | htmlcov
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203",
    "W503",
    "E501",
    "E231",  # ✅ Игнорируем ложные срабатывания
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "htmlcov",
    "*.egg-info",
]